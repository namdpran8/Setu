name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags starting with v (e.g., v1.0.0, v2.1)

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: Skia submodule is currently broken (no URL in .gitmodules).
      # You will need to download/build Skia manually in the steps below.

      # NOTE: If Skia or other libraries need to be built from source (because the pre-built 
      # .lib files aren't in Git), you will need to add a step here to build/download them.

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Create Release Package
        run: |
          New-Item -ItemType Directory -Force -Path release_package
          Copy-Item build\Release\setu_runtime.exe -Destination release_package\
          Copy-Item apkresources -Destination release_package\ -Recurse
          Compress-Archive -Path release_package\* -DestinationPath setu_release.zip
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: setu_release.zip
          generate_release_notes: true
